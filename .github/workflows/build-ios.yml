name: Build iOS

# 只做 iOS。macOS / visionOS 的 target 已从项目中移除。
on:
  push:
    branches: ['main']
    tags-ignore: ['**']
    paths-ignore:
      - 'LICENSE'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      rebuild_sysroot:
        description: 'Force rebuild sysroot (slow, ~2-4h)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      package_ipa:
        description: 'Package a fake-signed .ipa'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  # Xcode 27 runner image (macOS 27, Xcode 27.0 default)
  RUNNER_IMAGE: xcode-27
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 60

jobs:
  configuration:
    name: Setup configuration
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.checker.outputs.runner }}
      xcode-path: ${{ steps.checker.outputs.xcode-path }}
    steps:
      - name: Resolve runner and Xcode path
        id: checker
        shell: bash
        env:
          IS_SELF_HOSTED_RUNNER: ${{ vars.IS_SELF_HOSTED_RUNNER || 'false' }}
          HOST_XCODE_PATH: ${{ vars.HOST_XCODE_PATH }}
        run: |
          # Xcode 27 image ships Xcode 27.0 at /Applications/Xcode_27.app,
          # which /Applications/Xcode.app also symlinks to.
          echo "xcode-path=${HOST_XCODE_PATH:-/Applications/Xcode.app}" >> $GITHUB_OUTPUT
          if [ "$IS_SELF_HOSTED_RUNNER" == "true" ]; then
            echo "runner=['self-hosted', 'macOS']" >> $GITHUB_OUTPUT
          else
            echo "runner='$RUNNER_IMAGE'" >> $GITHUB_OUTPUT
          fi

  build-sysroot:
    name: Build Sysroot
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner) }}
    needs: configuration
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ios,     arch: arm64,  label: iOS }
          - { platform: ios-tci, arch: arm64,  label: iOS SE }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        shell: bash
        run: |
          TARGET="${{ needs.configuration.outputs.xcode-path }}"
          echo "xcode-select -p => $(xcode-select -p)"
          [[ "$(xcode-select -p)" == "$TARGET"* ]] || sudo xcode-select -s "$TARGET"
          xcodebuild -version

      # Cache the sysroot keyed only on the inputs that actually change its
      # contents (scripts + patches). The commit SHA is deliberately NOT part
      # of the key, so a Release on a new commit can still reuse a sysroot
      # built by an earlier CI run. To force a rebuild, pass
      # rebuild_sysroot=true from workflow_dispatch.
      - name: Restore Sysroot Cache
        id: cache-sysroot
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-${{ matrix.platform }}-${{ matrix.arch }}
          key: sysroot-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}

      - name: Setup Path
        shell: bash
        run: echo "/opt/homebrew/opt/bison/bin:/usr/local/opt/bison/bin" >> $GITHUB_PATH

      - name: Install Requirements
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        run: |
          brew uninstall --ignore-dependencies cmake || true
          brew install bison pkg-config gettext glib-utils libgpg-error nasm meson cmake
          brew install llvm spirv-llvm-translator libxcb libxrandr
          pip3 install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
          rm -f /usr/local/lib/pkgconfig/*.pc || true

      # Capture the build output so a failure can be surfaced in the job
      # summary. The raw log download endpoint redirects to Azure Blob storage,
      # which is not reachable from every network, so the tail of the log is
      # mirrored into $GITHUB_STEP_SUMMARY where it stays readable.
      #
      # `sh -x` is deliberately enabled: the script is long and only reports a
      # bare exit code on failure, so the trace is what identifies the exact
      # command that broke.
      - name: Build Sysroot
        id: build-sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        shell: bash
        run: |
          set -o pipefail
          sh -x ./scripts/build_dependencies.sh -p ${{ matrix.platform }} -a ${{ matrix.arch }} 2>&1 | tee /tmp/sysroot-build.log
        env:
          # TCI builds OOM on the default parallelism, so pin it to 1 worker.
          NCPU: ${{ endsWith(matrix.platform, '-tci') && '1' || '0' }}

      - name: Publish build log to job summary
        if: failure() && steps.build-sysroot.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Sysroot build failed: ${{ matrix.platform }}-${{ matrix.arch }}"
            echo ""
            echo "Total log lines: \`$(wc -l < /tmp/sysroot-build.log 2>/dev/null || echo 0)\`"
            echo ""
            echo "### Last 120 lines"
            echo '```text'
            tail -n 120 /tmp/sysroot-build.log 2>/dev/null || echo "(no log captured)"
            echo '```'
            echo ""
            echo "### Last failing commands (+ lines from the trace)"
            echo '```text'
            grep -n '^+' /tmp/sysroot-build.log 2>/dev/null | tail -n 60 || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish environment info to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sysroot environment: ${{ matrix.platform }}-${{ matrix.arch }}"
            echo ""
            echo '```text'
            echo "python3         : $(python3 --version 2>&1)"
            echo "python3 path    : $(command -v python3)"
            echo "xcodebuild      : $(xcodebuild -version 2>&1 | tr '\n' ' ')"
            echo "xcode-select -p : $(xcode-select -p)"
            echo "bison           : $(bison -V 2>&1 | head -1)"
            echo "cmake           : $(cmake --version 2>&1 | head -1)"
            echo "meson           : $(meson --version 2>&1 | head -1)"
            echo "NCPU            : ${NCPU}"
            echo ""
            echo "-- python module imports --"
            for m in six pyparsing distutils yaml distlib mako setuptools; do
              if python3 -c "import $m" 2>/dev/null; then
                echo "  $m -> OK"
              else
                echo "  $m -> FAIL"
              fi
            done
            echo ""
            echo "-- distutils location --"
            python3 -c "import distutils; print(distutils.__file__)" 2>&1 | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compress Sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        run: tar -acf sysroot.tgz sysroot*

      - name: Upload Sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sysroot-${{ matrix.platform }}-${{ matrix.arch }}
          path: sysroot.tgz
          retention-days: 7

      - name: Save Cache
        if: steps.cache-sysroot.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ./sysroot-${{ matrix.platform }}-${{ matrix.arch }}
          key: ${{ steps.cache-sysroot.outputs.cache-primary-key }}
          upload-chunk-size: 1048576

  build-ios:
    name: Build ${{ matrix.label }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner) }}
    needs: [configuration, build-sysroot]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, sdk: iphoneos, platform: ios,     scheme: iOS,    label: 'iOS' }
          - { arch: arm64, sdk: iphoneos, platform: ios-tci, scheme: iOS-SE, label: 'iOS SE' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Sysroot
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-${{ matrix.platform }}-${{ matrix.arch }}
          key: sysroot-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}
          fail-on-cache-miss: true

      - name: Setup Xcode
        shell: bash
        run: |
          TARGET="${{ needs.configuration.outputs.xcode-path }}"
          [[ "$(xcode-select -p)" == "$TARGET"* ]] || sudo xcode-select -s "$TARGET"
          xcodebuild -version

      - name: Build
        run: |
          ./scripts/build_utm.sh -k ${{ matrix.sdk }} -s ${{ matrix.scheme }} -a ${{ matrix.arch }} -o UTM
          tar -acf UTM.xcarchive.tgz UTM.xcarchive

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: Archive-${{ matrix.scheme }}-${{ matrix.arch }}
          path: UTM.xcarchive.tgz

  package-ios:
    name: Package ${{ matrix.name }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner) }}
    needs: [configuration, build-ios]
    if: github.event_name == 'release' || github.event.inputs.package_ipa == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: iOS,    mode: ipa,    name: 'PC-on-iPhone.ipa',    path: 'PC-on-iPhone.ipa' }
          - { scheme: iOS,    mode: ipa-hv, name: 'PC-on-iPhone-HV.ipa', path: 'PC-on-iPhone.ipa' }
          - { scheme: iOS-SE, mode: ipa-se, name: 'PC-on-iPhone-SE.ipa', path: 'PC-on-iPhone SE.ipa' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Archive
        uses: actions/download-artifact@v4
        with:
          name: Archive-${{ matrix.scheme }}-arm64

      - name: Install ldid
        run: brew install ldid dpkg

      - name: Fakesign IPA
        run: |
          tar -xf UTM.xcarchive.tgz
          ./scripts/package.sh ${{ matrix.mode }} UTM.xcarchive .

      - name: Upload Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}

      - name: Upload Release Asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.path }}" --clobber
