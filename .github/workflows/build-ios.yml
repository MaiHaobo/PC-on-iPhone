name: Build iOS

# 只做 iOS。macOS / visionOS 的 target 已从项目中移除。
on:
  # Pushes intentionally do NOT trigger this workflow: every debug push used
  # to burn a full runner pass and flood the Actions list with numbered runs.
  # Builds happen on a Release (attaches the IPAs) or manually from the
  # Actions tab (workflow_dispatch, can also just build + upload artifacts).
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      rebuild_sysroot:
        description: 'Force rebuild sysroot (slow, ~2-4h)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      package_ipa:
        description: 'Package a fake-signed .ipa'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

# The default token is read-only, which makes `gh release upload` fail with
# "HTTP 403: Resource not accessible by integration". Uploading release assets
# needs contents: write.
permissions:
  contents: write

env:
  # macOS 26 image, which ships Xcode 26.6 (Build 17F113) as the default at
  # /Applications/Xcode_26.6.app; /Applications/Xcode.app symlinks to it.
  #
  # Xcode 27 was tried first (via the `xcode-27` preview image) and could not
  # build WebKit's ANGLE with `xcodebuild archive` — it failed with exit code
  # 65 inside build_angle(). ANGLE is upstream-verified against the Xcode 26
  # line, so this workflow targets that instead.
  RUNNER_IMAGE: macos-26
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 60

jobs:
  configuration:
    name: Setup configuration
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.checker.outputs.runner }}
      xcode-path: ${{ steps.checker.outputs.xcode-path }}
    steps:
      - name: Resolve runner and Xcode path
        id: checker
        shell: bash
        env:
          IS_SELF_HOSTED_RUNNER: ${{ vars.IS_SELF_HOSTED_RUNNER || 'false' }}
          HOST_XCODE_PATH: ${{ vars.HOST_XCODE_PATH }}
        run: |
          echo "xcode-path=${HOST_XCODE_PATH:-/Applications/Xcode.app}" >> $GITHUB_OUTPUT
          if [ "$IS_SELF_HOSTED_RUNNER" == "true" ]; then
            echo "runner=['self-hosted', 'macOS']" >> $GITHUB_OUTPUT
          else
            echo "runner='$RUNNER_IMAGE'" >> $GITHUB_OUTPUT
          fi

  build-sysroot:
    name: Build Sysroot
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner) }}
    needs: configuration
    strategy:
      fail-fast: false
      matrix:
        # ios       — JIT sysroot for the main app
        # ios-tci   — threaded-interpreter QEMU for UTM SE, which bundles
        #             sysroot-iOS-TCI-arm64/share/qemu (see PLATFORM_SUFFIX
        #             = "-TCI" in the project). Slow: NCPU is pinned to 1
        #             because the TCI QEMU build OOMs otherwise. Built once,
        #             then reused from the cache.
        include:
          - { platform: ios, arch: arm64, label: iOS }
          - { platform: ios-tci, arch: arm64, label: iOS SE }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        shell: bash
        run: |
          TARGET="${{ needs.configuration.outputs.xcode-path }}"
          echo "xcode-select -p => $(xcode-select -p)"
          [[ "$(xcode-select -p)" == "$TARGET"* ]] || sudo xcode-select -s "$TARGET"
          xcodebuild -version

      # Cache the sysroot keyed only on the inputs that actually change its
      # contents (scripts + patches). The commit SHA is deliberately NOT part
      # of the key, so a Release on a new commit can still reuse a sysroot
      # built by an earlier CI run. To force a rebuild, pass
      # rebuild_sysroot=true from workflow_dispatch.
      # Caches are scoped to the ref that wrote them, and a tag ref can never
      # see a branch ref's cache. A release run therefore computed the right
      # key and was still told "Cache not found", because the sysroot had only
      # ever been saved from main. (Worse, GitHub recorded that tag save under
      # the malformed ref "refs/heads/refs/tags/v0.2", so nothing could ever
      # read it back.)
      #
      # restore-keys makes the lookup fall back to the newest cache whose key
      # starts with the same sysroot-<platform>-<arch> prefix, so a release on
      # a tag still picks up whatever main built. The exact key is tried first.
      - name: Restore Sysroot Cache
        id: cache-sysroot
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-${{ matrix.platform }}-${{ matrix.arch }}
          key: sysroot-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}
          restore-keys: |
            sysroot-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Setup Path
        shell: bash
        run: echo "/opt/homebrew/opt/bison/bin:/usr/local/opt/bison/bin" >> $GITHUB_PATH

      - name: Install Requirements
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        shell: bash
        run: |
          brew uninstall --ignore-dependencies cmake || true
          brew install bison pkg-config gettext glib-utils libgpg-error nasm meson cmake
          # `spirv-tools` is separate from `spirv-llvm-translator` and is NOT
          # pulled in as a dependency of it. Mesa's KosmicKrisp driver needs
          # BOTH when built with -Dllvm=enabled: the translator provides
          # `llvmspirvlib` and SPIRV-Tools provides the `spirv-tools` library
          # plus its pkg-config file. Without it `meson setup` dies at
          # meson.build:2092 with:
          #   Dependency "SPIRV-Tools" not found (tried pkg-config, framework and cmake)
          brew install llvm spirv-llvm-translator spirv-tools libxcb libxrandr
          pip3 install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
          rm -f /usr/local/lib/pkgconfig/*.pc || true

          # Probe the toolchain into annotations (the console log itself is not
          # reachable through the API, annotations are). If Mesa's configure
          # step restarts or its log can't be found, the cause is usually a
          # second meson on PATH.
          echo "::notice::diag: $(command -v meson) | meson $(meson --version 2>&1) | ninja $(ninja --version 2>&1) | cmake $(cmake --version 2>&1 | head -1)"
          which -a meson 2>&1 | while IFS= read -r p; do echo "::notice::meson on PATH: $p"; done || true
          for m in mesonbuild.mesonmain mesonbuild.coredata; do
            python3 -c "import $m, os; print('$m', os.path.dirname($m.__file__))" 2>&1 | head -1 | while IFS= read -r l; do echo "::notice::module: $l"; done
          done
          for d in "$(brew --prefix meson 2>/dev/null)/libexec/lib/python3.14/site-packages/mesonbuild" \
                   "$(python3 -c 'import site;print(site.getusersitepackages())' 2>/dev/null)/mesonbuild" \
                   /opt/homebrew/lib/python3*/site-packages/mesonbuild; do
            if [ -d "$d" ]; then echo "::notice::mesonbuild dir: $d"; fi
          done
          pkg-config --exists spirv-tools && echo "::notice::pkg-config spirv-tools: $(pkg-config --modversion spirv-tools)" || echo "::error::pkg-config cannot see spirv-tools"
          ls "$(brew --prefix spirv-tools 2>/dev/null)/lib/pkgconfig" 2>&1 | head -5 | while IFS= read -r l; do echo "::notice::spirv-tools pc: $l"; done

      # Capture the build output so a failure can be surfaced in the job
      # summary. The raw log download endpoint redirects to Azure Blob storage,
      # which is not reachable from every network, so the tail of the log is
      # mirrored into $GITHUB_STEP_SUMMARY where it stays readable.
      #
      # `sh -x` is deliberately enabled: the script is long and only reports a
      # bare exit code on failure, so the trace is what identifies the exact
      # command that broke.
      - name: Build Sysroot
        id: build-sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        shell: bash
        run: |
          set -o pipefail
          sh -x ./scripts/build_dependencies.sh -p ${{ matrix.platform }} -a ${{ matrix.arch }} 2>&1 | tee /tmp/sysroot-build.log
        env:
          # TCI builds OOM on the default parallelism, so pin it to 1 worker.
          NCPU: ${{ endsWith(matrix.platform, '-tci') && '1' || '0' }}

      # Diagnostics on failure. Two quirks of GitHub Actions shape this step:
      #   1. `shell: bash` runs with `-e -o pipefail`, so a grep with no
      #      matches would kill the whole step — every pipeline ends in
      #      `|| true` and no raw pipeline feeds a loop.
      #   2. Annotations are capped at 10 errors per step, so the output is
      #      prioritized: the non-trace tail (where the failing command's
      #      actual message lives) and the last trace lines (which command
      #      failed). The full detail goes to the job summary, which is
      #      visible in the run page even though it is not readable via API.
      - name: Publish build diagnostics
        if: failure() && steps.build-sysroot.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          LOG=/tmp/sysroot-build.log
          emit () { echo "::error::$(printf '%s' "$1" | tail -c 900)"; }

          TAIL=$(grep -av '^+' "$LOG" 2>/dev/null | grep -av '^[[:space:]]*$' | tail -n 30 || true)
          TRACE=$(grep '^+' "$LOG" 2>/dev/null | tail -n 6 || true)
          ERRS=$(grep -aiE 'error|fatal|Traceback|FAILED:' "$LOG" 2>/dev/null | grep -av '^+' | tail -n 40 || true)

          # Meson keeps its own log, and it is complete where the streamed
          # stdout is not (meson re-runs `setup` after a failed configure and
          # truncates the visible output). Grab the newest one under the build
          # dir so the real "ERROR:" block is available even when stdout lost it.
          MESONLOG=$(find . -maxdepth 6 -name meson-log.txt -newermt '-90 minutes' 2>/dev/null | head -3 || true)

          {
            echo "## Sysroot build failed: ${{ matrix.platform }}-${{ matrix.arch }}"
            echo ""
            echo "Log lines: $(wc -l < "$LOG" 2>/dev/null || echo 0)"
            echo ""
            echo "### Last trace commands (which command failed)"
            echo '```text'
            printf '%s\n' "$TRACE"
            echo '```'
            echo ""
            echo "### Last 30 non-trace lines (the actual error)"
            echo '```text'
            printf '%s\n' "$TAIL"
            echo '```'
            echo ""
            echo "### Error-ish lines (last 40)"
            echo '```text'
            printf '%s\n' "$ERRS"
            echo '```'
            echo ""
            for f in $MESONLOG; do
              echo "### $f (last 120 lines)"
              echo '```text'
              tail -n 120 "$f" 2>/dev/null || true
              echo '```'
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotation budget: 10 errors per step. #7 burned 4 of them on
          # meson's `WARNING: ... deprecated` and its `Run-time dependency X
          # found: YES` chatter, so the budget now goes to the trace first
          # (which command died) and only then to lines that look like real
          # errors. Content comes from variables (never re-expanded) and `<<<`
          # feeds the loop without pipes, so pipefail cannot kill this step.
          TRACE2=$(printf '%s\n' "$TRACE" | tail -n 2)
          FATAL=$(printf '%s\n' "$ERRS" | grep -aiE 'ERROR|: error|error:|fatal|Traceback|FAILED:|not found|No such file' | tail -n 6 || true)

          emit_block () {
            echo "::error::$1"
            while IFS= read -r l; do
              if [ -n "$l" ]; then emit "$l"; fi
            done <<< "$2"
          }

          emit_block "--- last trace commands (which command failed) ---" "$TRACE2"
          emit_block "--- error lines ---" "$FATAL"

          # Anything left over (a failure whose only clue is the raw output).
          if [ -z "$FATAL" ]; then
            emit_block "--- last non-trace lines (no ERROR:-style line found) ---" \
              "$(printf '%s\n' "$TAIL" | tail -n 5)"
          fi

      - name: Publish environment info to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sysroot environment: ${{ matrix.platform }}-${{ matrix.arch }}"
            echo ""
            echo '```text'
            echo "python3         : $(python3 --version 2>&1)"
            echo "python3 path    : $(command -v python3)"
            echo "xcodebuild      : $(xcodebuild -version 2>&1 | tr '\n' ' ')"
            echo "xcode-select -p : $(xcode-select -p)"
            echo "bison           : $(bison -V 2>&1 | head -1)"
            echo "cmake           : $(cmake --version 2>&1 | head -1)"
            echo "meson           : $(meson --version 2>&1 | head -1)"
            echo "NCPU            : ${NCPU}"
            echo ""
            echo "-- python module imports --"
            for m in six pyparsing distutils yaml distlib mako setuptools; do
              if python3 -c "import $m" 2>/dev/null; then
                echo "  $m -> OK"
              else
                echo "  $m -> FAIL"
              fi
            done
            echo ""
            echo "-- distutils location --"
            # On the cache-hit path Install Requirements is skipped, so
            # setuptools may be absent and the import fails; that is exactly
            # the information this step exists to report, not a reason to fail
            # the job (pipefail would otherwise kill the step here).
            (python3 -c "import distutils; print(distutils.__file__)" 2>&1 | head -3) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compress Sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        run: tar -acf sysroot.tgz sysroot*

      - name: Upload Sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sysroot-${{ matrix.platform }}-${{ matrix.arch }}
          path: sysroot.tgz
          retention-days: 7

      - name: Save Cache
        if: steps.cache-sysroot.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ./sysroot-${{ matrix.platform }}-${{ matrix.arch }}
          key: ${{ steps.cache-sysroot.outputs.cache-primary-key }}
          upload-chunk-size: 1048576

  build-ios:
    name: Build ${{ matrix.label }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner) }}
    needs: [configuration, build-sysroot]
    strategy:
      fail-fast: false
      matrix:
        # Each entry archives exactly one scheme, because build_utm.sh picks a
        # single .app out of the archive (`find … -name '*.app' | head -1`).
        # Both entries run in parallel, so the wall-clock cost of shipping the
        # JIT build and the SE build together is the cost of one archive.
        # `sysroot` selects which sysroot the scheme consumes: the iOS-SE
        # target links against sysroot-iOS-TCI-arm64 (PLATFORM_SUFFIX=-TCI),
        # everything else uses the plain iOS sysroot.
        include:
          - { arch: arm64, sdk: iphoneos, platform: ios, sysroot: ios, scheme: iOS, label: 'iOS' }
          - { arch: arm64, sdk: iphoneos, platform: ios, sysroot: ios-tci, scheme: iOS-SE, label: 'iOS SE' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Sysroot
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-${{ matrix.sysroot }}-${{ matrix.arch }}
          key: sysroot-${{ matrix.sysroot }}-${{ matrix.arch }}-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}
          # Same cross-ref fallback as build-sysroot: a release run executes on
          # a tag ref, which cannot see a cache written from main.
          restore-keys: |
            sysroot-${{ matrix.sysroot }}-${{ matrix.arch }}-
          fail-on-cache-miss: true

      # SwiftPM clones 17 dependencies from scratch on every run, and with the
      # matrix above that download happens twice in parallel. The key is the
      # resolved file, so a dependency bump invalidates the cache but anything
      # else reuses it.
      - name: Restore SwiftPM Cache
        id: cache-swiftpm
        uses: actions/cache/restore@v4
        with:
          path: .swiftpm-cache
          key: swiftpm-${{ runner.os }}-${{ hashFiles('UTM.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Setup Xcode
        shell: bash
        run: |
          TARGET="${{ needs.configuration.outputs.xcode-path }}"
          [[ "$(xcode-select -p)" == "$TARGET"* ]] || sudo xcode-select -s "$TARGET"
          xcodebuild -version

      - name: Build
        id: build-archive
        shell: bash
        run: |
          set -o pipefail
          ./scripts/build_utm.sh -k ${{ matrix.sdk }} -s ${{ matrix.scheme }} -a ${{ matrix.arch }} -o UTM -d "$PWD/.swiftpm-cache" 2>&1 | tee /tmp/utm-build.log
          tar -acf UTM.xcarchive.tgz UTM.xcarchive

      # Same rationale as the sysroot diagnostics: the raw log endpoint
      # redirects to Azure Blob storage, which is not always reachable, and
      # xcodebuild's exit code alone says nothing. Swift compile errors are
      # prefixed "file:line:col: error:" which this surfaces directly.
      - name: Publish archive build diagnostics
        if: failure() && steps.build-archive.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          LOG=/tmp/utm-build.log
          emit () { echo "::error::$(printf '%s' "$1" | tail -c 900)"; }

          # Every distinct compile error, in file:line:col form. Deduplicated
          # because xcodebuild repeats them across compile batches.
          ERRLINES=$(grep -aoE '[^ ]+\.(swift|m|h|mm|cpp):[0-9]+:[0-9]+: error: .*' "$LOG" 2>/dev/null | sed 's|.*/PC-on-iPhone/||' | sort -u | head -n 8 || true)
          TAIL=$(grep -av '^[[:space:]]*$' "$LOG" 2>/dev/null | tail -n 20 || true)
          FAILED=$(grep -a "The following build commands failed:" -A 8 "$LOG" 2>/dev/null | tail -n 8 || true)

          {
            echo "## Archive build failed: ${{ matrix.scheme }}"
            echo ""
            echo '```text'
            printf '%s\n' "$FAILED"
            printf '%s\n' "$ERRLINES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::--- compile errors (deduped, up to 8) ---"
          while IFS= read -r l; do
            if [ -n "$l" ]; then emit "$l"; fi
          done <<< "$ERRLINES"
          if [ -z "$ERRLINES" ]; then
            echo "::error::--- no compiler errors found; last output lines ---"
            while IFS= read -r l; do
              if [ -n "$l" ]; then emit "$l"; fi
            done <<< "$(printf '%s\n' "$TAIL" | tail -n 4)"
          fi

      # Both matrix entries race to save this key. GitHub only accepts the
      # first write for a given key and fails the loser, which is harmless —
      # the cache is populated either way, so don't let the race fail the job.
      - name: Save SwiftPM Cache
        if: steps.cache-swiftpm.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .swiftpm-cache
          key: ${{ steps.cache-swiftpm.outputs.cache-primary-key }}

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: Archive-${{ matrix.scheme }}-${{ matrix.arch }}
          path: UTM.xcarchive.tgz

  package-ios:
    name: Package ${{ matrix.label }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner) }}
    needs: [configuration, build-ios]
    # Both entry points produce the same set of IPAs:
    #   - a Release, which attaches them to the release
    #   - a manual dispatch with package_ipa=true, which uploads them as
    #     build artifacts
    if: github.event_name == 'release' || github.event.inputs.package_ipa == 'true'
    strategy:
      fail-fast: false
      matrix:
        # `archive` is the scheme whose xcarchive this entry unpacks, `mode` is
        # the package.sh mode, and `path` is the file package.sh writes.
        #
        # package.sh separates the bundle/PRODUCT_NAME (which decides the .app
        # directory) from the destination IPA filename, so `path` stays stable
        # here even though the SE bundle is now named "PC on iPhone SE".
        #
        # The JIT build yields two IPAs from the SAME archive: `ipa` keeps the
        # dynamic-codesigning entitlement (needs a JIT-enabling app like
        # StikDebug/UTM SE's own mechanism) and `ipa-hv` drops it, so the build
        # runs without JIT on a stock device.
        include:
          - { label: 'PC-on-iPhone.ipa',    archive: iOS,    mode: ipa,    path: 'UTM.ipa' }
          - { label: 'PC-on-iPhone-HV.ipa', archive: iOS,    mode: ipa-hv, path: 'UTM.ipa' }
          - { label: 'PC-on-iPhone-SE.ipa', archive: iOS-SE, mode: ipa-se, path: 'UTM SE.ipa' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Archive
        uses: actions/download-artifact@v4
        with:
          name: Archive-${{ matrix.archive }}-arm64

      - name: Install ldid
        run: brew install ldid dpkg

      - name: Fakesign IPA
        run: |
          tar -xf UTM.xcarchive.tgz
          ./scripts/package.sh ${{ matrix.mode }} UTM.xcarchive .

      # Rename to the release-facing name so the asset is unambiguous even
      # though package.sh derives the filename from the bundle name.
      - name: Rename for release
        if: matrix.path != matrix.label
        run: mv -v "${{ matrix.path }}" "${{ matrix.label }}"

      - name: Upload Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.label }}

      # A failure here is almost always the token, not the upload itself, so
      # check the API's own view of the permission before trying: the default
      # token is read-only and produces a bare "HTTP 403: Resource not
      # accessible by integration" that says nothing about why.
      - name: Upload Release Asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "token permissions for this repo: $(gh api repos/${{ github.repository }} --jq '.permissions // "unknown"' 2>&1 | head -1)"
          ls -la "${{ matrix.label }}"
          gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.label }}" --clobber
