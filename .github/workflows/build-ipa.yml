name: Build IPA (Unsigned)

# 无签名编译：不需要任何证书 / Secrets，仅验证代码可编译性并产出未签名 IPA。
# 签名版脚本（scripts/build-ipa.sh）保留在仓库里，等证书就绪后换回来即可。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 编译并打包（不签名）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-ipa-unsigned.sh

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PC-on-iPhone-unsigned-IPA
          path: build/export/*.ipa
          retention-days: 30

      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
